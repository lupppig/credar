name: credar

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: credar
      POSTGRES_USER: credar
      POSTGRES_PASSWORD: credar_local
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${CREDAR_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credar -d credar"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks: [platform]

  migrate:
    image: migrate/migrate:v4.19.1@sha256:cc4ad8e19d66791e3689405d9a028ce6e9614f32032db14acda1469f7201d6e4
    entrypoint:
      - /usr/local/bin/migrate
      - -path=/migrations
      - -database=${CREDAR_DATABASE_URL:-postgres://credar:credar_local@postgres:5432/credar?sslmode=disable}
    command: ["up"]
    volumes:
      - ../backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [platform]

  nats:
    image: nats:2.15.0-alpine3.22@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    command:
      - --jetstream
      - --store_dir=/data
      - --http_port=8222
      - --server_name=credar-local
    ports:
      - "127.0.0.1:${CREDAR_NATS_HOST_PORT:-4222}:4222"
      - "127.0.0.1:${CREDAR_NATS_MONITOR_HOST_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider 'http://127.0.0.1:8222/healthz?js-enabled-only=true'",
        ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 3s
    restart: unless-stopped
    networks: [platform]

  redis:
    image: redis:8.10.1-alpine3.23@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:${CREDAR_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 3s
    restart: unless-stopped
    networks: [platform]

  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command:
      - -v=0
      - server
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -dir=/data
      - -filer
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -volume.max=0
      - -master.volumeSizeLimitMB=1024
    ports:
      - "127.0.0.1:${CREDAR_SEAWEEDFS_HOST_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:9333/cluster/healthz >/dev/null && curl --silent http://127.0.0.1:8333/ >/dev/null",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [platform]

  kratos-migrate:
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    environment:
      DSN: postgres://credar:credar_local@postgres:5432/kratos?sslmode=disable&max_conns=10&max_idle_conns=2
    command: -c /etc/config/kratos/kratos.yaml migrate sql -e --yes
    volumes:
      - ./kratos:/etc/config/kratos:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [platform]

  kratos:
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    environment:
      DSN: postgres://credar:credar_local@postgres:5432/kratos?sslmode=disable&max_conns=10&max_idle_conns=2
      SESSION_LIFESPAN: ${CREDAR_KRATOS_SESSION_LIFESPAN:-24h}
    command: serve -c /etc/config/kratos/kratos.yaml --dev
    ports:
      - "127.0.0.1:${CREDAR_KRATOS_PUBLIC_HOST_PORT:-4433}:4433"
      - "127.0.0.1:${CREDAR_KRATOS_ADMIN_HOST_PORT:-4434}:4434"
    volumes:
      - ./kratos:/etc/config/kratos:ro
    depends_on:
      postgres:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4434/health/ready"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [platform]

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      CREDAR_ENVIRONMENT: ${CREDAR_ENVIRONMENT:-local}
      CREDAR_LOG_LEVEL: ${CREDAR_LOG_LEVEL:-info}
      CREDAR_HTTP_ADDRESS: :8080
      CREDAR_HTTP_SHUTDOWN_TIMEOUT_SECONDS: ${CREDAR_HTTP_SHUTDOWN_TIMEOUT_SECONDS:-10}
      CREDAR_READINESS_TIMEOUT_SECONDS: ${CREDAR_READINESS_TIMEOUT_SECONDS:-2}
      CREDAR_DATABASE_URL: ${CREDAR_DATABASE_URL:-postgres://credar:credar_local@postgres:5432/credar?sslmode=disable}
      CREDAR_DATABASE_MAX_CONNECTIONS: ${CREDAR_DATABASE_MAX_CONNECTIONS:-10}
      CREDAR_DATABASE_MIN_CONNECTIONS: ${CREDAR_DATABASE_MIN_CONNECTIONS:-1}
      CREDAR_NATS_URL: ${CREDAR_NATS_URL:-nats://nats:4222}
      CREDAR_OUTBOX_POLL_MILLISECONDS: ${CREDAR_OUTBOX_POLL_MILLISECONDS:-250}
      CREDAR_OUTBOX_LEASE_SECONDS: ${CREDAR_OUTBOX_LEASE_SECONDS:-30}
      CREDAR_OUTBOX_BATCH_SIZE: ${CREDAR_OUTBOX_BATCH_SIZE:-100}
      CREDAR_OUTBOX_MAX_ATTEMPTS: ${CREDAR_OUTBOX_MAX_ATTEMPTS:-8}
      CREDAR_OUTBOX_BASE_BACKOFF_SECONDS: ${CREDAR_OUTBOX_BASE_BACKOFF_SECONDS:-1}
      CREDAR_OUTBOX_MAX_BACKOFF_SECONDS: ${CREDAR_OUTBOX_MAX_BACKOFF_SECONDS:-300}
      CREDAR_REDIS_URL: ${CREDAR_REDIS_URL:-redis://redis:6379/0}
      CREDAR_REDIS_KEY_PREFIX: ${CREDAR_REDIS_KEY_PREFIX:-credar}
      CREDAR_OBJECT_STORAGE_ENDPOINT: ${CREDAR_OBJECT_STORAGE_ENDPOINT:-http://seaweedfs:8333}
      CREDAR_OBJECT_STORAGE_BUCKET: ${CREDAR_OBJECT_STORAGE_BUCKET:-credar-local}
      CREDAR_OBJECT_STORAGE_ACCESS_KEY: ${CREDAR_OBJECT_STORAGE_ACCESS_KEY:-local-access-key}
      CREDAR_OBJECT_STORAGE_SECRET_KEY: ${CREDAR_OBJECT_STORAGE_SECRET_KEY:-local-secret-key}
      CREDAR_KRATOS_PUBLIC_URL: ${CREDAR_KRATOS_PUBLIC_URL:-http://kratos:4433}
      CREDAR_KRATOS_ADMIN_URL: ${CREDAR_KRATOS_ADMIN_URL:-http://kratos:4434}
      CREDAR_KRATOS_REQUEST_TIMEOUT_SECONDS: ${CREDAR_KRATOS_REQUEST_TIMEOUT_SECONDS:-2}
    ports:
      - "127.0.0.1:${CREDAR_BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      kratos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/credar-api", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [platform]

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_CREDAR_API_BASE_URL: ${NEXT_PUBLIC_CREDAR_API_BASE_URL:-http://localhost:8080}
    environment:
      CREDAR_BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "127.0.0.1:${CREDAR_FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)throw new Error(String(r.status))}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [platform]

volumes:
  postgres-data:
  nats-data:
  redis-data:
  seaweedfs-data:

networks:
  platform:
    driver: bridge
